###############################################################################
#  LiveTalking Configuration
#  CLI arguments override values in this file
###############################################################################

# -------- Audio ----------------------------------------------------------
l: 10
m: 8
r: 10

# -------- Avatar Model ----------------------------------------------------------
model: soulx                   # musetalk / wav2lip / ultralight / soulx
avatar_id: my_avatar
batch_size: 4                  # soulx generates fewer frames per call; 4 is stable

# -------- SoulX-FlashHead (only used when model: soulx) ----------------------
soulx_ckpt_dir: '/workspace/models/SoulX-FlashHead-1_3B'
soulx_wav2vec_dir: '/workspace/models/wav2vec2-base-960h'
soulx_venv_python: '/workspace/soulx_venv/bin/python'

# -------- Custom Actions ----------------------------------------------------------
customvideo_config: ''

# -------- TTS ----------------------------------------------------------
tts: edgetts                   # edgetts for MVP (internet required) — swap to cosyvoice for fully server-side
REF_FILE: 'en-US-JennyNeural'  # EdgeTTS voice name (English female, natural)
REF_TEXT: ''
TTS_SERVER: ''

# -------- LLM ----------------------------------------------------------
llm_provider: ollama           # ollama = fully server-side, no paid API
llm_model: 'llama3.1:8b'       # pull with: ollama pull llama3.1:8b

# -------- Transport ----------------------------------------------------------
transport: webrtc              # rtcpush / webrtc / rtmp / virtualcam
stun: 'stun:stun.freeswitch.org:3478'  # stun server URL
push_url: ''                   # push URL for rtcpush/rtmp (not needed for webrtc/virtualcam)
max_session: 5                 # max concurrent sessions
listenport: 8010
