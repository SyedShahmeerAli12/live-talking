<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Avatar</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #000;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  font-family: system-ui, sans-serif;
}

#video {
  width: 100vmin;
  height: 100vmin;
  max-width: 600px;
  max-height: 600px;
  border-radius: 20px;
  background: #111;
  display: block;
  object-fit: cover;
}

#audio { display: none; }

/* overlay at bottom of video */
#overlay {
  position: fixed;
  bottom: 40px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  pointer-events: none;
}

/* mic orb */
#orb {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: rgba(255,255,255,0.12);
  backdrop-filter: blur(8px);
  border: 2px solid rgba(255,255,255,0.2);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  pointer-events: all;
  transition: background 0.2s, border-color 0.2s;
}
#orb svg { width: 24px; height: 24px; fill: rgba(255,255,255,0.7); transition: fill 0.2s; }
#orb.listening {
  background: rgba(59, 130, 246, 0.5);
  border-color: rgba(59, 130, 246, 0.8);
  animation: glow 1.4s ease-in-out infinite;
}
#orb.listening svg { fill: #fff; }

#label {
  font-size: 12px;
  color: rgba(255,255,255,0.45);
  letter-spacing: 0.5px;
}

@keyframes glow {
  0%, 100% { box-shadow: 0 0 0 0 rgba(59,130,246,0.4); }
  50%       { box-shadow: 0 0 0 12px rgba(59,130,246,0); }
}
</style>
</head>
<body>

<video id="video" autoplay playsinline muted></video>
<audio id="audio" autoplay></audio>

<div id="overlay">
  <div id="orb" title="Tap to mute / unmute mic">
    <!-- mic icon -->
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 1a4 4 0 0 1 4 4v6a4 4 0 0 1-8 0V5a4 4 0 0 1 4-4zm-6 9a6 6 0 0 0 12 0h2a8 8 0 0 1-7 7.938V20h3v2H8v-2h3v-2.062A8 8 0 0 1 4 10h2z"/>
    </svg>
  </div>
  <span id="label">Connecting…</span>
</div>

<script>
// ── WebRTC ────────────────────────────────────────────────────
var pc = null;
var sessionid = '0';

function startWebRTC() {
  pc = new RTCPeerConnection({
    sdpSemantics: 'unified-plan',
    iceServers: [
      { urls: 'stun:stun.l.google.com:19302' },
      { urls: ['turn:numb.viagenie.ca:3478'], username: 'webrtc@live.com', credential: 'muazkh' }
    ]
  });

  pc.addEventListener('track', function(evt) {
    if (evt.track.kind === 'video') document.getElementById('video').srcObject = evt.streams[0];
    else document.getElementById('audio').srcObject = evt.streams[0];
  });

  pc.addEventListener('connectionstatechange', function() {
    if (pc.connectionState === 'connected') {
      setLabel('Listening…');
      setListening(true);
      startRecognition();
    } else if (pc.connectionState === 'failed' || pc.connectionState === 'disconnected') {
      setLabel('Disconnected — reload');
      setListening(false);
      stopRecognition();
    }
  });

  pc.addTransceiver('video', { direction: 'recvonly' });
  pc.addTransceiver('audio', { direction: 'recvonly' });

  pc.createOffer()
    .then(function(o) { return pc.setLocalDescription(o); })
    .then(function() {
      return new Promise(function(resolve) {
        if (pc.iceGatheringState === 'complete') return resolve();
        pc.addEventListener('icegatheringstatechange', function fn() {
          if (pc.iceGatheringState === 'complete') { pc.removeEventListener('icegatheringstatechange', fn); resolve(); }
        });
      });
    })
    .then(function() {
      return fetch('/offer', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ sdp: pc.localDescription.sdp, type: pc.localDescription.type })
      });
    })
    .then(function(r) { return r.json(); })
    .then(function(ans) {
      sessionid = String(ans.sessionid);
      return pc.setRemoteDescription(new RTCSessionDescription({ sdp: ans.sdp, type: ans.type }));
    })
    .catch(function(e) { setLabel('Error: ' + e.message); });
}

function sendText(text) {
  if (!text || !text.trim()) return;
  fetch('/human', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ text: text.trim(), type: 'chat', interrupt: true, sessionid: sessionid })
  });
}

// ── Continuous Speech Recognition ─────────────────────────────
var recognition = null;
var recogActive = false;
var muted = false;

function setLabel(txt) { document.getElementById('label').textContent = txt; }
function setListening(on) {
  var orb = document.getElementById('orb');
  if (on) orb.classList.add('listening'); else orb.classList.remove('listening');
}

function startRecognition() {
  if (!('webkitSpeechRecognition' in window || 'SpeechRecognition' in window)) {
    setLabel('Speech not supported in this browser');
    return;
  }
  if (recogActive || muted) return;
  recogActive = true; // guard before start() to prevent double-start race

  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SR();
  recognition.lang = 'en-US';
  recognition.continuous = true;
  recognition.interimResults = false;

  recognition.onstart = function() {
    recogActive = true;
    if (!muted) { setLabel('Listening…'); setListening(true); }
  };

  recognition.onresult = function(event) {
    // collect all new final results since last index
    var transcript = '';
    for (var i = event.resultIndex; i < event.results.length; i++) {
      if (event.results[i].isFinal) transcript += event.results[i][0].transcript;
    }
    if (transcript.trim()) {
      setLabel('You: ' + transcript.trim());
      sendText(transcript.trim());
      setTimeout(function() { if (!muted) setLabel('Listening…'); }, 2000);
    }
  };

  recognition.onerror = function(e) {
    recogActive = false;
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
      setLabel('Mic blocked — allow mic in browser');
      return; // don't retry on permission denied
    }
    if (!muted) setTimeout(startRecognition, 800);
  };

  recognition.onend = function() {
    recogActive = false;
    // auto-restart so it stays continuous
    if (!muted) setTimeout(startRecognition, 200);
  };

  try { recognition.start(); } catch(e) { recogActive = false; }
}

function stopRecognition() {
  recogActive = false;
  if (recognition) { try { recognition.stop(); } catch(e) {} }
}

// ── Mute toggle (tap orb) ─────────────────────────────────────
document.getElementById('orb').addEventListener('click', function() {
  muted = !muted;
  if (muted) {
    stopRecognition();
    setListening(false);
    setLabel('Muted — tap to unmute');
  } else {
    setLabel('Listening…');
    setListening(true);
    startRecognition();
  }
});

// ── Boot ──────────────────────────────────────────────────────
window.addEventListener('load', startWebRTC);
window.addEventListener('beforeunload', function() { if (pc) pc.close(); });
</script>
</body>
</html>
